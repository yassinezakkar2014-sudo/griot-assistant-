<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique — Belgessem</title>
  <meta name="description" content="Tous les slips connectés, téléphones et packs Belgessem.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>B</text></svg>">
</head>
<body data-page="shop" data-init="shop">
  <header id="site-header"></header>
  <main class="container">
    <div class="shop-head">
      <p class="eyebrow">Boutique Belgessem</p>
      <h1 id="shop-title">Toute la boutique</h1>
      <p class="muted" id="result-count"></p>
    </div>
    <div class="toolbar">
      <div class="chips" role="group" aria-label="Catégories">
        <button class="chip" data-cat="all">Tout</button>
        <button class="chip" data-cat="slips">Slips connectés</button>
        <button class="chip" data-cat="telephones">Téléphones</button>
        <button class="chip" data-cat="packs">Packs</button>
      </div>
      <div class="tools">
        <input id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher un produit">
        <select id="sort" aria-label="Trier">
          <option value="featured">Pertinence</option>
          <option value="price-asc">Prix croissant</option>
          <option value="price-desc">Prix décroissant</option>
          <option value="rating">Mieux notés</option>
        </select>
      </div>
    </div>
    <div class="grid" id="product-grid"></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
