# Déploiement Render (Blueprint) : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: griot
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GRIOT_PASSWORD
        sync: false

  # OpenJarvis seul : interface web + API compatible OpenAI, moteur Groq via LiteLLM.
  - type: web
    name: openjarvis
    runtime: docker
    plan: free
    dockerfilePath: ./openjarvis/Dockerfile
    dockerContext: ./openjarvis
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: JARVIS_MODEL
        value: groq/openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      # Clé d'accès à OpenJarvis (à saisir dans Settings de l'interface)
      - key: OPENJARVIS_API_KEY
        sync: false
